version: "3.8"

services:
  standup:
    build: .
    container_name: standup-app
    ports:
      - "9060:9060"
    env_file:
      - .env.production
    environment:
      - TZ=Asia/Seoul
      - ROOT_PATH=/standup
    volumes:
      - ./logs:/app/logs
      # PR7 — tech_trend + HopenVision 입력 마운트 (운영 MacBook 절대 경로).
      # 컨테이너 안에서는 /data/* 로 일관 참조 — .env 의 MEDIUM_DIGEST_REPORTS_DIR
      # / HOPENVISION_REPO_PATH 와 1:1 매칭.
      - /Users/rainend/GIT/medium-digest-agent/reports:/data/medium-digest:ro
      - /Users/rainend/GIT/hopenvision:/data/hopenvision:ro
    restart: always
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9060/api/v1/health')"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

networks:
  app-network:
    external: true
    name: unmong-network
